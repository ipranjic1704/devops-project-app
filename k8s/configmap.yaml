apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ticketing
data:
  # --- Postgres (ne-tajni dio; lozinka ide u Secret) ---
  POSTGRES_HOST: postgres        # ime k8s Service-a baze (interni DNS)
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ticketing
  POSTGRES_USER: ticketing_user

  # --- Redis ---
  REDIS_HOST: redis              # ime k8s Service-a redisa
  REDIS_PORT: "6379"

  # --- Aplikacija ---
  API_PORT: "8080"
  FRONTEND_PORT: "3000"
  QUEUE_NAME: ticket_orders
  NODE_ENV: production
