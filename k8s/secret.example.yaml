# PRIMJER Secret-a — NE sadrži pravu lozinku i SMIJE se commitati.
# Pravi Secret se NE drži u gitu; kreira se komandom (vidi README / playbook):
#
#   kubectl create secret generic app-secret \
#     --namespace ticketing \
#     --from-literal=POSTGRES_PASSWORD='PostaviJakuLozinku'
#
# Ovaj primjer postoji samo kao dokumentacija strukture (ishod I4: tajne bez hardkodinga).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: ticketing
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
