name: CI — build, scan, push

# Pipeline se okida na push i pull request prema main grani.
# - push na main  -> build + scan + OBJAVA imagea u registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: workflowu dajemo točno onoliko prava koliko mu treba, ništa više.
permissions:
  contents: read # čitanje koda repozitorija (checkout)
  packages: write # push imagea u GitHub Container Registry (GHCR)
  security-events: write # upload Trivy

jobs:
  build-scan-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD: gradimo u lokalni Docker daemon (push: false, load: true) namjerno —
      # tako Trivy može skenirati image prije nego ode na registry.
      - name: Build slike
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          target: runtime
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.service }}:latest
          # Povezuje objavljenu sliku na GHCR-u s ovim repozitorijem.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # QUALITY GATE: ovo je sigurnosna brana pipelinea.
      # exit-code: '1' znači da job PADNE ako Trivy nađe ranjivost zadanog severityja.
      # Branimo na CRITICAL (kod nas 0 -> prolazi). HIGH se NE blokira jer naš jedini
      # HIGH dolazi iz npm CLI-ja ugrađenog u baznu sliku (node:22-alpine) i ne možemo
      # ga popraviti u vlastitom kodu — ali ga i dalje vidimo u SARIF izvještaju ispod.
      - name: Trivy — quality gate (CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      # Drugi Trivy prolaz: generira SARIF sa SVIM severitetima radi evidencije.
      # exit-code: '0' -> ovaj korak NIKAD ne ruši build (samo izvještava).
      # if: always() -> izvrti se i ako je gate iznad pao (da imamo nalaz i tada).
      - name: Trivy — SARIF izvještaj
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - name: Upload scan reporta (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 30

      # Prikaži nalaze u GitHub Security -> Code scanning.
      # continue-on-error: true -> ako je repo private (gdje upload traži GitHub Advanced
      # Security), ovaj korak neće srušiti cijeli pipeline.
      - name: Upload na GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # LOGIN u registry — samo na push
      # Koristim ugrađeni GITHUB_TOKEN tako da nema hardcoded lozinke
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PUSH: objavljujemo tek ovdje — znači slika je prošla sigurnosnu branu.
      # Ako je gate iznad pao, ovaj se korak preskače (job je već u statusu failed).
      - name: Push slika na GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.service }}:latest
